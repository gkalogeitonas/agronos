# Self-contained production stack: app, web, workers, Reverb, EMQX and MariaDB.
#
#   cp .env.production.example .env   # then fill in the values
#   docker compose up -d --build
#
# On the Dokploy VPS this file is combined with docker-compose.dokploy.yml,
# which drops the bundled database in favour of a shared MariaDB.

x-build-args: &build-args
  VITE_APP_NAME: ${APP_NAME:-Agronos}
  VITE_MAPBOX_TOKEN: ${VITE_MAPBOX_TOKEN:-}
  VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:-}
  VITE_REVERB_HOST: ${VITE_REVERB_HOST:-localhost}
  VITE_REVERB_PORT: ${VITE_REVERB_PORT:-8080}
  VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-http}

x-app: &app
  image: agronos-app:latest
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: app
    args: *build-args
  env_file: .env
  restart: unless-stopped
  volumes:
    - storage:/var/www/storage

services:
  app:
    <<: *app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "grep -q php-fpm /proc/1/cmdline"]
      interval: 5s
      timeout: 3s
      retries: 60

  web:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: web
      args: *build-args
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8000}:80"
    depends_on:
      app:
        condition: service_healthy

  worker:
    <<: *app
    user: www-data
    command: php artisan queue:work database --sleep=3 --tries=3 --timeout=0 --queue=sensor-data,default
    depends_on:
      app:
        condition: service_healthy

  sensor-worker:
    <<: *app
    user: www-data
    command: php artisan queue:work database --sleep=1 --tries=3 --timeout=30 --queue=sensor-data
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    <<: *app
    user: www-data
    command: php artisan schedule:work
    depends_on:
      app:
        condition: service_healthy

  reverb:
    <<: *app
    user: www-data
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "${REVERB_PUBLIC_PORT:-8080}:8080"
    depends_on:
      app:
        condition: service_healthy

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  emqx:
    image: emqx/emqx:5.7.0
    restart: unless-stopped
    ports:
      - "1883:1883"   # MQTT
      - "8883:8883"   # MQTT over TLS
      - "8083:8083"   # MQTT over WebSocket
      - "18083:18083" # Dashboard
    environment:
      EMQX_NAME: emqx
      EMQX_HOST: 127.0.0.1
      EMQX_API_KEY__BOOTSTRAP_FILE: etc/default_api_key.conf
      EMQX_DASHBOARD__DEFAULT_USERNAME: ${MQTT_DASHBOARD_USERNAME:-admin}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${MQTT_DASHBOARD_PASSWORD:?Set MQTT_DASHBOARD_PASSWORD}
      EMQX_AUTHENTICATION__1__MECHANISM: password_based
      EMQX_AUTHENTICATION__1__BACKEND: built_in_database
      EMQX_LOG__CONSOLE__LEVEL: info
      EMQX_LOG__FILE__LEVEL: info
    configs:
      - source: emqx_api_keys
        target: /opt/emqx/etc/default_api_key.conf
      - source: emqx_acl
        target: /opt/emqx/etc/acl.conf
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
      - emqx_etc:/opt/emqx/etc

configs:
  emqx_api_keys:
    content: "${MQTT_API_KEY:?Set MQTT_API_KEY}:${MQTT_API_SECRET:?Set MQTT_API_SECRET}"
  emqx_acl:
    file: ./docker/emqx/acl.conf

volumes:
  storage:
  db_data:
  emqx_data:
  emqx_log:
  emqx_etc:
